<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AhOOffice</title>
<style>
body{margin:0;font-family:system-ui;background:#0f172a;color:#fff;padding:16px}
.top{text-align:center;padding:20px 0}
.top img{width:90px;border-radius:20px;background:#fff;padding:5px}
h1{color:#ff7a00;margin:10px 0 0}
input{width:100%;padding:16px;border-radius:14px;border:none;font-size:18px;margin:18px 0;box-sizing:border-box}
.card{background:#1e293b;padding:14px;border-radius:12px;margin-bottom:10px;border-left:4px solid #ff7a00}
.nom{font-weight:bold;color:#38bdf8;margin-bottom:6px}
</style>
</head>
<body>
<div class="top">
<img src="icon-512.png" onerror="this.style.display='none'">
<h1>AhOOffice</h1>
<p>Ton assistant formules - OFFLINE</p>
</div>
<input type="text" id="q" placeholder="Tape satellite, energie, pH...">
<div id="res"></div>
<script>
const FORMULES=[
{nom:"Vitesse satellite",tags:"satellite orbite gravitation",txt:"v = √(GM/r)"},
{nom:"Energie cinetique",tags:"energie cinetique",txt:"Ec = 1/2 m v²"},
{nom:"pH acide base",tags:"ph acide base chimie",txt:"pH = -log[H+]"},
{nom:"Loi Ohm",tags:"ohm electricite tension",txt:"U = R × I"},
{nom:"Poussée Archimede",tags:"archimede poussee fluide",txt:"Pa = ρ × V × g"}
];
const res=document.getElementById('res');
function show(list){
res.innerHTML="";
if(list.length==0){res.innerHTML="<div class=card>Aucun résultat. Tape 'satellite' ou 'energie' pour tester.</div>";return;}
list.forEach(f=>{
let d=document.createElement('div');d.className='card';
d.innerHTML=`<div class=nom>${f.nom}</div><div>${f.txt}</div><div style='opacity:.5;font-size:12px;margin-top:6px'>${f.tags}</div>`;
res.appendChild(d);
});
}
show(FORMULES);
document.getElementById('q').addEventListener('input',e=>{
let t=e.target.value.toLowerCase().trim();
if(t.length<2){show(FORMULES);return;}
show(FORMULES.filter(f=>(f.nom+f.tags+f.txt).toLowerCase().includes(t)));
});
</script>
</body>
</html>
