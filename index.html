<section id="audio-transcription" class="hidden bg-white p-5 rounded-2xl m-3">
<button onclick="showAccueil()" class="text-xs bg-gray-100 px-3 py-1 rounded-full">⬅️ Retour</button>
<h2 class="font-bold mt-2">🎙️ Audio -> Texte</h2>

<!-- OSCILLOSCOPE QUI BOUGE PENDANT QUE TU PARLES -->
<canvas id="oscillo" width="600" height="140" class="w-full h-[110px] bg-black rounded-xl mt-3"></canvas>
<div class="flex justify-between text-[10px] font-mono mt-1"><span id="timer">00:00</span><span id="dbLevel" class="text-green-400">● En attente</span></div>

<div class="flex gap-2 mt-3">
<button id="btnRec" onclick="startAudio()" class="flex-1 bg-[#ff3b30] text-white py-3 rounded-xl font-bold">🔴 Enregistrer</button>
<button onclick="stopAudio()" class="bg-black text-white px-5 rounded-xl">⏹️ Stop</button>
<button onclick="clearAudio()" class="bg-gray-200 px-4 rounded-xl">🗑️</button>
</div>

<p class="text-xs mt-3 font-bold">Voix à garder :</p>
<select id="voix-filtre" class="w-full p-2 border rounded-xl text-xs">
<option value="toutes">Toutes les voix</option>
<option value="voix1">Voix 1 - Seulement celle-là</option>
<option value="voix2">Voix 2</option>
</select>

<div id="audioBox" contenteditable="true" class="mt-3 border-2 border-[#1377F2] min-h-[140px] p-3 rounded-xl bg-[#f9f9ff] text-sm outline-none">La transcription RESTE ici - tu peux corriger au clavier...</div>
<button onclick="sendToExpose()" class="mt-3 w-full bg-[#1377F2] text-white py-3 rounded-xl text-xs font-bold">📤 Envoyer vers Exposé</button>
<select id="langue-transcription" class="w-full mt-3 p-2 border rounded-xl text-xs"><option value="fr-FR">Français</option><option value="ln-CD">Lingala</option><option value="sw-KE">Swahili</option><option value="en-US">English</option></select>
</section>

<script>
let audioCtx, analyser, dataArr, animId, isRec=false, recognition, fullTranscript="", timerInt, sec=0;
function startAudio(){
let canvas=document.getElementById('oscillo'); let ctx=canvas.getContext('2d');
audioCtx=new (window.AudioContext||window.webkitAudioContext)(); analyser=audioCtx.createAnalyser(); analyser.fftSize=2048; dataArr=new Uint8Array(analyser.frequencyBinCount);
navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
let src=audioCtx.createMediaStreamSource(stream); src.connect(analyser);
isRec=true;
(function draw(){ if(!isRec) return; animId=requestAnimationFrame(draw); analyser.getByteTimeDomainData(dataArr); ctx.fillStyle="#000"; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.strokeStyle="#00FF88"; ctx.shadowColor="#00FF88"; ctx.shadowBlur=10; ctx.lineWidth=2.5; ctx.beginPath(); let slice=canvas.width/dataArr.length, x=0; for(let i=0;i<dataArr.length;i++){let v=dataArr[i]/128.0; let y=v*canvas.height/2; i==0?ctx.moveTo(x,y):ctx.lineTo(x,y); x+=slice;} ctx.stroke(); ctx.shadowBlur=0; let avg=dataArr.reduce((a,b)=>a+Math.abs(b-128),0)/dataArr.length; document.getElementById('dbLevel').innerText=`● REC • ${Math.round(avg*2)} dB`; })();
const SR=window.SpeechRecognition||window.webkitSpeechRecognition; recognition=new SR(); recognition.lang=document.getElementById('langue-transcription').value||'fr-FR'; recognition.continuous=true; recognition.interimResults=true; recognition.onresult=e=>{let inter=""; for(let i=e.resultIndex;i<e.results.length;i++){let t=typeof cerveauQuiEcoute!=="undefined"?cerveauQuiEcoute(e.results[i][0].transcript):e.results[i][0].transcript; if(e.results[i].isFinal)fullTranscript+=t+" "; else inter=t;} document.getElementById('audioBox').innerText=fullTranscript+inter;}; recognition.onend=()=>{if(isRec)recognition.start();}; recognition.start();
sec=0; timerInt=setInterval(()=>{sec++; document.getElementById('timer').innerText=`00:${String(sec).padStart(2,'0')}`;},1000);
document.getElementById('btnRec').innerText="⏺️ En cours...";
});
}
function stopAudio(){isRec=false; clearInterval(timerInt); cancelAnimationFrame(animId); if(recognition)recognition.stop(); if(audioCtx)audioCtx.close(); document.getElementById('btnRec').innerText="🔴 Enregistrer"; document.getElementById('dbLevel').innerText="■ STOP";}
function clearAudio(){fullTranscript=""; document.getElementById('audioBox').innerText="La transcription RESTE ici...";}
function sendToExpose(){document.getElementById('editeur-expose').innerHTML+="<br><br>"+document.getElementById('audioBox').innerText; showOutil('expose-word');}
</script>
