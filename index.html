<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AhOOffice</title>
<style>
body{margin:0;font-family:system-ui;background:#0f172a;color:#fff;padding:14px}
.top{text-align:center;padding:12px 0}.top img{width:85px;border-radius:18px;background:#fff;padding:4px}
h1{color:#ff7a00;margin:8px 0 0}.sub{opacity:.6;font-size:13px}
.bar{display:flex;gap:8px;margin:16px 0}.bar input{flex:1;padding:14px;border-radius:12px;border:none;font-size:16px}
.btn{padding:12px 14px;border-radius:12px;border:none;font-weight:bold;cursor:pointer}
.btn-audio{background:#ff7a00;color:#000}.btn-scan{background:#38bdf8;color:#000}.btn-param{background:#334155;color:#fff}
.card{background:#1e293b;padding:14px;border-radius:12px;margin-bottom:10px;border-left:4px solid #ff7a00}
.nom{font-weight:bold;color:#38bdf8}.gros{font-size:32px;margin:8px 0;color:#fff}
.trans{padding:10px;background:#0f172a;border-radius:8px;border:1px dashed #ff7a00;margin-top:8px}
.small{font-size:12px;opacity:.6}
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.8);display:none;padding:20px;overflow:auto;z-index:99}
.box{background:#1e293b;padding:20px;border-radius:16px;max-width:500px;margin:20px auto}
canvas{background:#fff;border-radius:8px;width:100%;touch-action:none}
</style>
</head>
<body>
<div class="top"><img src="icon-512.png" onerror="this.style.display='none'"><h1>AhOOffice</h1><div class="sub">Audio • Scan • Exposé IA • OFFLINE</div></div>
<div class="bar">
<input id="q" placeholder="Tape ou parle...">
<button class="btn btn-audio" id="bAudio">🎤</button>
<button class="btn btn-scan" id="bScan">📷</button>
<button class="btn btn-param" id="bParam">⚙️</button>
</div>
<div id="status" class="small"></div>
<div id="res"></div>

<div id="modalParam" class="modal"><div class="box">
<h2>⚙️ Paramètres</h2>
<button class="btn" style="background:#ff7a00;width:100%" onclick="openPrivacy()">📄 Confidentialité & Signature</button><br><br>
<button class="btn" style="background:#334155;width:100%;color:#fff" onclick="closeM()">Fermer</button>
</div></div>

<div id="modalPriv" class="modal"><div class="box">
<h2>🔒 Confidentialité</h2><p class="small">AhOOffice OFFLINE, rien n'est envoyé.</p>
<canvas id="sign" height="140"></canvas>
<p><label><input type="checkbox" id="chk"> J'accepte</label></p>
<button class="btn" style="background:#22c55e;width:100%" id="bSign">Valider & Signer</button><br><br>
<button class="btn" style="background:#334155;width:100%;color:#fff" onclick="closeM()">Annuler</button>
</div></div>

<script>
const FORMULES=[
{nom:"Vitesse satellite",tags:"satellite",sym:"v = √(GM/r)"},
{nom:"Energie cinetique",tags:"energie",sym:"Ec = ½ m v²"},
{nom:"pH",tags:"ph",sym:"pH = -log[H⁺]"},
{nom:"Loi Ohm",tags:"ohm",sym:"U = R × I"}
];

function convertirVoixEnMaths(texte){
  let t = texte.toLowerCase();
  // Normalise accents pour mieux reconnaitre
  t = t.replaceAll("carrée","carree").replaceAll("carré","carre").replaceAll("égale","egale");

  // Dictionnaire son -> symbole
  t = t.replaceAll("racine carree de","√");
  t = t.replaceAll("racine carree","√");
  t = t.replaceAll("racine carre de","√");
  t = t.replaceAll("racine carre","√");
  t = t.replaceAll("au carre","²");
  t = t.replaceAll("carre","²");
  t = t.replaceAll("fois","×");
  t = t.replaceAll("divise par","/");
  t = t.replaceAll("sur","/");
  t = t.replaceAll("egale", "=");

  // Nettoie les espaces autour de √
  t = t.replaceAll("√ ","√").replaceAll("√ ","√");
  return t;
}

function calculerSiPossible(texteConverti){
  // Cherche √9, √ 9, √9
  let m = texteConverti.match(/√\s*(\d+)/);
  if(m){
    let n = parseInt(m[1]);
    let r = Math.sqrt(n);
    return `√${n} = ${r}`;
  }
  return texteConverti;
}

const resDiv=document.getElementById('res'), statusDiv=document.getElementById('status');

function show(list, transcriptionOriginal=""){
  resDiv.innerHTML="";
  if(transcriptionOriginal){
    let converti = convertirVoixEnMaths(transcriptionOriginal);
    let calcule = calculerSiPossible(converti);
    resDiv.innerHTML+=`<div class="card"><div class="nom">🎤 Tu as dit :</div><div>${transcriptionOriginal}</div><div class="trans"><div class="small">Reconnaissance symboles :</div><div class="gros">${calcule}</div><div class="small">Symbole √ bien reconnu</div></div></div>`;
  }
  list.forEach(f=>{
    let d=document.createElement('div'); d.className='card';
    d.innerHTML=`<div class="nom">${f.nom}</div><div style="font-size:18px">${f.sym}</div>`;
    resDiv.appendChild(d);
  });
}
show(FORMULES);

document.getElementById('q').addEventListener('input',e=>{
  let t=e.target.value.toLowerCase();
  if(t.length<2) return show(FORMULES);
  show(FORMULES.filter(f=>(f.nom+f.tags+f.sym).toLowerCase().includes(t)));
});

document.getElementById('bAudio').onclick=()=>{
  const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!Rec){ alert("Utilise Chrome pour l'audio"); return; }
  let rec = new Rec(); rec.lang="fr-FR";
  statusDiv.textContent="🎤 Parle... dis 'racine carrée de 9'";
  rec.onresult=ev=>{
    let txt = ev.results[0][0].transcript;
    statusDiv.textContent="Transcrit: "+txt;
    show([], txt);
  };
  rec.start();
};
document.getElementById('bParam').onclick=()=>{ document.getElementById('modalParam').style.display='block'; };
function openPrivacy(){ closeM(); document.getElementById('modalPriv').style.display='block'; initSign(); }
function closeM(){ document.querySelectorAll('.modal').forEach(m=>m.style.display='none'); }
document.getElementById('bScan').onclick=()=>{ statusDiv.textContent="📷 Scan gardé comme avant"; };
let drawing=false,c,ctx;
function initSign(){ c=document.getElementById('sign'); ctx=c.getContext('2d'); ctx.clearRect(0,0,c.width,c.height); c.onpointerdown=()=>drawing=true; c.onpointerup=()=>drawing=false; c.onpointermove=e=>{ if(!drawing) return; let r=c.getBoundingClientRect(); ctx.fillRect(e.clientX-r.left, e.clientY-r.top, 3,3); }; }
document.getElementById('bSign').onclick=()=>{ if(!document.getElementById('chk').checked){ alert("Coche la case"); return; } localStorage.setItem('aho_signed','oui'); closeM(); statusDiv.textContent="✅ Signé"; };
</script>
</body>
</html>
